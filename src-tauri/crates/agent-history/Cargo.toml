[package]
name = "agent-history"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Read-only native agent history capture and encrypted local archive"

[[bin]]
name = "pathkeep-agent-history"
path = "src/bin/pathkeep-agent-history.rs"

[dependencies]
tar = "0.4.46"
regex.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
similar = "2.7.0"
base64 = "0.22.1"
vault-fs = { path = "../vault-fs" }
vault-layout = { path = "../vault-layout" }
chrono.workspace = true
chrono-tz = "0.10"
directories.workspace = true
hex.workspace = true
libc.workspace = true
same-file = "1.0.6"
cap-primitives = "4.0.3"
rusqlite = { workspace = true, features = ["hooks", "limits"] }
serde.workspace = true
# Native payloads may contain integers/decimals beyond machine precision. Raw bytes
# still remain the authority for whitespace, key order and numeric notation.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
walkdir.workspace = true
tantivy = "0.27.0"
vault-crypto = { path = "../vault-crypto" }
vault-store = { path = "../vault-store" }
zeroize = "1.8.2"
# Already used at this version by the workspace; needed for native Codex and dsh streams.
zstd = "0.14.3"
# Same binary varint codec already in the workspace lockfile.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
