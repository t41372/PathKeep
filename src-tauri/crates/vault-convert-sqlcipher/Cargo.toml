[package]
name = "vault-convert-sqlcipher"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Verified, resumable SQLCipher to Turso conversion for PathKeep"

[features]
# Old-format archive fixtures for tests of everything that reads them, here and in the worker
# and desktop crates.
test-fixtures = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
vault-core = { path = "../vault-core" }
vault-crypto = { path = "../vault-crypto" }
vault-store = { path = "../vault-store" }

[dev-dependencies]
browser-history-fixtures = { path = "../browser-history-fixtures" }
hex.workspace = true
libc.workspace = true
vault-core = { path = "../vault-core", features = ["test-fixtures"] }
zip.workspace = true


[[test]]
name = "benchmark"
required-features = ["test-fixtures"]

[[test]]
name = "bundle"
required-features = ["test-fixtures"]

[[test]]
name = "collisions"
required-features = ["test-fixtures"]

[[test]]
name = "conversion"
required-features = ["test-fixtures"]

[[test]]
name = "ingest_parity"
required-features = ["test-fixtures"]

[[test]]
name = "old_versions"
required-features = ["test-fixtures"]

[[test]]
name = "snapshot"
required-features = ["test-fixtures"]
