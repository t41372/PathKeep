[package]
name = "vault-core"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
# Native seeding fixtures (`test_support`) shared with the worker and desktop test crates.
test-fixtures = []

[dependencies]
vault-crypto = { path = "../vault-crypto" }
zeroize = "1"
anyhow.workspace = true
browser-history-parser = { version = "0.1.0", path = "../browser-history-parser" }
chrono.workspace = true
# The IANA zones Insights puts days in (`insights_zone.rs`) and Ask renders visit times in, from
# the chrono maintainers.
chrono-tz = "0.10"
directories.workspace = true
futures-core.workspace = true
getrandom.workspace = true
hex.workspace = true
iana-time-zone = "0.1.64"
icu_normalizer.workspace = true
icu_segmenter.workspace = true
libc.workspace = true
plist.workspace = true
publicsuffix = "2.3.0"
regex.workspace = true
regex-syntax = "0.8.10"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "charset", "http2", "rustls-tls"] }
rig-core.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
safetensors.workspace = true
schemars.workspace = true
scraper = "0.24.0"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tar = "0.4.45"
thiserror.workspace = true
# HF tokenizer for the static embedding model; loads tokenizer.json from disk.
tokenizers.workspace = true
tokio.workspace = true
# Streams the in-app model download (`ai/model_files.rs`) with byte progress.
ureq.workspace = true
vault-store = { path = "../vault-store" }
vault-search = { path = "../vault-search" }
walkdir.workspace = true
# code-mode sandbox runtime (W-AI-8); pure-Rust Cranelift + a minimal scoped WASI (stdin/stdout-only
# RPC channel, no fs/net/env/real-clock) so the Javy QuickJS→WASM guest can run real JS.
wasmtime.workspace = true
wasmtime-wasi.workspace = true
bytes.workspace = true
zip.workspace = true

[dev-dependencies]
vault-crypto = { path = "../vault-crypto", features = ["crash-points"] }
vault-search = { path = "../vault-search", features = ["crash-points"] }
browser-history-fixtures = { version = "0.1.0", path = "../browser-history-fixtures" }
# Already regular deps of the crate; restated here only so the env-gated LM Studio e2e
# integration tests (compiled as separate crates) can drive the real async stream, seed an isolated
# project root, and read the durable agent trace back.
futures-core.workspace = true
mockito = "1.7.0"
tempfile.workspace = true
tokio.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

