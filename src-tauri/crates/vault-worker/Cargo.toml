[package]
name = "vault-worker"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
agent-history = { path = "../agent-history" }
fs4 = "0.13.1"
same-file = "1.0.6"
libc.workspace = true
uuid = { version = "1.23.1", features = ["v4","serde"] }
vault-build = { path = "../vault-build" }
vault-layout = { path = "../vault-layout" }
vault-convert-sqlcipher = { path = "../vault-convert-sqlcipher" }
zeroize = "1"
vault-crypto = { path = "../vault-crypto" }
vault-store = { path = "../vault-store" }
anyhow.workspace = true
chrono.workspace = true
log = "0.4.28"
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vault-owner-ipc = { path = "../vault-owner-ipc" }
vault-core = { version = "0.1.0", path = "../vault-core" }
vault-platform = { version = "0.1.0", path = "../vault-platform" }

[dev-dependencies]
tantivy = "0.27.0"
zstd = "0.14.3"
vault-core = { path = "../vault-core", features = ["test-fixtures"] }
vault-convert-sqlcipher = { path = "../vault-convert-sqlcipher", features = ["test-fixtures"] }
rusqlite.workspace = true
tempfile.workspace = true
