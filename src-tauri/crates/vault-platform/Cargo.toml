[package]
name = "vault-platform"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
directories.workspace = true
keyring-core.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
vault-core = { version = "0.1.0", path = "../vault-core" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "0.2.3", features = ["keychain"] }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "0.5.1"
# When the computer last woke (`power.rs`). Already in the build (vault-owner-ipc).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_WindowsProgramming"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "0.3.3", features = ["crypto-rust", "vendored"] }

# Menu bar icon support probe. Both crates are already in the Linux build
# (dbus through the keyring store), so this adds no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.11"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
