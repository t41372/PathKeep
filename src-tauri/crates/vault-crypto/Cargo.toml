[package]
name = "vault-crypto"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Encryption at rest for PathKeep: key envelope, Turso spill files, encrypted Tantivy directory"

[features]
# Test-only. Lets the crash tests stop a child process at a named step of an atomic file
# replacement. The app never enables it.
crash-points = []

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
ctr = { version = "0.9.2", features = ["zeroize"] }
getrandom.workspace = true
hkdf = "0.12.4"
# Part of the Tantivy repository; named directly only for its `StableDeref` trait, which
# `OwnedBytes::new` requires and Tantivy does not re-export.
ownedbytes = "0.9.0"
sha2.workspace = true
tantivy = { version = "0.26.2", default-features = false }
thiserror.workspace = true
turso_core = "=0.8.1"
zeroize = "1.8.2"

[dev-dependencies]
libc.workspace = true
# Default features add `MmapDirectory` (the benchmark baseline), LZ4 and stemming.
tantivy = "0.26.2"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
turso = { version = "=0.8.1", default-features = false }
vault-crypto = { path = ".", features = ["crash-points"] }
