[package]
name = "vault-crypto"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Encryption at rest for PathKeep: key envelope and sub-keys"

[features]
# Test-only. Lets the crash tests stop a child process at a named step of an atomic file
# replacement. The app never enables it.
crash-points = []

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
getrandom.workspace = true
hkdf = "0.12.4"
sha2.workspace = true
thiserror.workspace = true
zeroize = "1.8.2"

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
vault-crypto = { path = ".", features = ["crash-points"] }
