[package]
name = "vault-crypto"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Encryption at rest for PathKeep: key envelope, sub-keys and Turso spill-file encryption"

[features]
# Test-only. Lets the crash tests stop a child process at a named step of an atomic file
# replacement. The app never enables it.
crash-points = []

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
ctr = { version = "0.9.2", features = ["zeroize"] }
getrandom.workspace = true
hkdf = "0.12.4"
sha2.workspace = true
thiserror.workspace = true
turso_core = "=0.8.1"
zeroize = "1.8.2"

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
turso = { version = "=0.8.1", default-features = false }
vault-crypto = { path = ".", features = ["crash-points"] }
