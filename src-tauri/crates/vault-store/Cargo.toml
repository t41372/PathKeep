[package]
name = "vault-store"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"
license.workspace = true
description = "Thread-owned, synchronous Turso storage for PathKeep"

[dependencies]
turso = { version = "=0.8.1", default-features = false }
tokio = { workspace = true, features = ["rt", "time"] }
thiserror.workspace = true
zeroize = "1"
sha2.workspace = true
# Turso reports through `tracing`; engine_log.rs routes its warnings into the app's `log` sink.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
log = "0.4.28"

[dev-dependencies]
tempfile.workspace = true
