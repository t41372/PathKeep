[package]
name = "pathkeep-desktop"
version = "0.5.0-dev"
edition = "2024"
publish = false
description = "Audit-first desktop archive for browser history"
license = "GPL-3.0-only"

[features]
default = []
devtools-bridge = ["dep:axum", "dep:tower-http"]

[lib]
name = "pathkeep_desktop"
path = "src/lib.rs"

[workspace]
members = [
  "crates/vault-store",
  "crates/vault-convert-sqlcipher",
  "crates/vault-owner-ipc",
  "crates/vault-core",
  "crates/vault-crypto",
  "crates/vault-search",
  "crates/vault-platform",
  "crates/vault-worker",
  "crates/browser-history-parser",
  "crates/browser-history-fixtures",
]
resolver = "2"

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
# Floor 1.0.103 = the fix for RUSTSEC-2026-0190 (unsoundness in `Error::downcast_mut()`).
anyhow = "1.0.103"
chrono = { version = "0.4.42", features = ["serde"] }
directories = "6.0.0"
futures-core = "0.3.32"
# ureq: the blocking HTTP client the in-app model download (`ai/model_files.rs`) streams the
# Hugging Face resolve URL with, for real byte progress. Defaults (rustls + gzip): no native-tls or
# OpenSSL, no tokio/reqwest pull.
ureq = "3.3.0"
getrandom = "0.3.4"
hex = "0.4.3"
icu_normalizer = { version = "2.2.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data", "auto"] }
keyring-core = "0.7.2"
libc = "0.2.177"
memmap2 = "0.9.11"
plist = "1.8.0"
regex = "1.12.2"
rig-core = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
rusqlite = { version = "0.39.0", features = ["backup", "bundled-sqlcipher-vendored-openssl", "serde_json"] }
# Same major as rig-core's `schemars` (1.x) so `LlmProvider`'s structured-output schema
# unifies with rig's `output_schema` type rather than introducing a second instance.
schemars = "1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Hugging Face's reader for the static embedding model's `model.safetensors` (one f32 matrix).
safetensors = "0.7.0"
sha2 = "0.10.9"
tempfile = "3.23.0"
# HF tokenizer (Apache-2.0) for the static embedding model, with ONLY the pure-Rust `fancy-regex`
# backend: no C `onig` build.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5.7"
walkdir = "2.5.0"
# code-mode sandbox runtime (W-AI-8, D7 / §G Layer 2). Pure-Rust Cranelift JIT + runtime; the
# `component-model`/`async` features are pulled transitively by `wasmtime-wasi`'s preview1 support
# (preview1 in wasmtime 48 is implemented atop the preview2/component machinery). NO pooling/gc; the
# build needs no C toolchain and the `wat` loader stays for the security-test guests.
# Floor is 48.0.6, fixing the September/October 2026 Wasmtime/WASI advisories, from
# RUSTSEC-2026-0327 (component callback stack overflow) to RUSTSEC-2026-0364. No 45.x release
# fixes this set; Wasmtime 48 requires Rust 1.95 or newer.
wasmtime = { version = "48.0.6", default-features = false, features = ["std", "runtime", "cranelift", "wat", "anyhow", "component-model", "async"] }
# code-mode scoped WASI (W-AI-8, D7 / §G Layer 2). The Javy (QuickJS→WASM) guest reaches the host
# ONLY through WASI fd I/O, so the sandbox grants a MINIMAL preview1 ctx: an in-memory stdin pipe
# (the request/reply RPC channel), an in-memory stdout capture, and a stderr sink — NO fs preopens,
# NO env, NO args, NO sockets, with a fixed zero clock + deterministic RNG. That honours the §G
# "no dangerous ambient authority" contract (no fs/net/real-clock/env) while letting real JS run.
# `default-features=false` + only `p1` drops the network/sockets stack; the preview1 sync linker is
# all we wire. No C toolchain.
wasmtime-wasi = { version = "48.0.6", default-features = false, features = ["p1"] }
# Zero-copy byte buffers named by the WASI stream traits (`InputStream`/`OutputStream`) the code-mode
# channel implements; already in the graph via wasmtime-wasi, restated so vault-core can name it.
bytes = "1.10.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dependencies]
futures-core.workspace = true
anyhow.workspace = true
axum = { version = "0.8.6", optional = true }
chrono.workspace = true
log = "0.4.28"
serde.workspace = true
serde_json.workspace = true
# macos-private-api: the transparent window behind the optional glass material (window-material.ts).
tauri = { version = "2.8.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2.4.3"
tauri-plugin-log = "2.8.0"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-updater = "2.10.1"
tokio.workspace = true
tower-http = { version = "0.6.6", optional = true, features = ["cors"] }
url.workspace = true
vault-core = { version = "0.1.0", path = "crates/vault-core" }
vault-platform = { version = "0.1.0", path = "crates/vault-platform" }
vault-owner-ipc = { path = "crates/vault-owner-ipc" }
vault-store = { path = "crates/vault-store" }
vault-worker = { version = "0.1.0", path = "crates/vault-worker" }

[dev-dependencies]
vault-core = { path = "crates/vault-core", features = ["test-fixtures"] }
vault-convert-sqlcipher = { path = "crates/vault-convert-sqlcipher", features = ["test-fixtures"] }
browser-history-fixtures = { path = "crates/browser-history-fixtures" }
rusqlite.workspace = true
tauri = { version = "2.8.5", features = ["test"] }
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

# Dev and test builds carry no debug info (user's call, 2026-10-12: nobody reads it). A failed
# assertion or panic still says its file and line (that comes from the panic location, not debug
# info), and backtraces and the thread dumps of a hung test still name each function; they lose
# only the line inside it, and a debugger sees no variables. Full debug info made linking every
# test binary peak at 20.6 GiB and target/debug 68 GB; line tables, 13.7 GiB and 29 GB
# (2026-10-11, Modal). Without them, on an Apple Silicon Mac (2026-10-12): src-tauri/target 12 GB
# instead of 34 GB, the E2E build 3.8 GB instead of 5.9 GB, and `bun run check` from a clean
# build 26 minutes.
[profile.dev]
debug = false

# The RustCrypto primitives are many times slower unoptimized: a debug-build unlock (Argon2id
# over 256 MiB) took 6.6 s instead of 0.36 s, and the encrypted search index decrypts every
# block it reads. They are small crates, so optimizing them in dev and test builds costs
# little build time and keeps `desktop:dev` and `cargo test` usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.ctr]
opt-level = 3

# The storage engine runs every archive statement. Unoptimised, a debug build
# executes the E2E fixture's first backup too slowly to finish, and the test
# suites spend most of their time inside it.
[profile.dev.package.turso_core]
opt-level = 3

[profile.dev.package.turso_parser]
opt-level = 3

[profile.dev.package.turso_sdk_kit]
opt-level = 3

[profile.dev.package.turso]
opt-level = 3

# Code mode compiles its JavaScript engine (a wasm module) with Cranelift on every run; a debug
# build would otherwise run that compiler unoptimised in every code-mode test and run_code call.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
