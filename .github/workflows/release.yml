name: Release
run-name: ${{ inputs.operation || 'prepare' }} ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a private draft, verify reviewed bytes, or publish them
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - verify
          - publish
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean
      release_tag:
        description: Exact target tag, such as v0.5.0
        required: true
        type: string
      approved_release_id:
        description: Reviewed draft ID, required for verify or publish
        required: false
        type: string
      approved_source_sha:
        description: Reviewed full source SHA, required for verify or publish
        required: false
        type: string
      approved_manifest_sha256:
        description: Reviewed RELEASE-MANIFEST.json digest, required for verify or publish
        required: false
        type: string
      immutable_releases_confirmed:
        description: An administrator checked immutable releases are enabled (publish only)
        required: false
        default: false
        type: boolean
      platforms:
        description: Platform matrix to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-windows
          - linux
          - windows
          - macos
      unsigned_preview:
        description: Build unsigned bundles without updater artifacts; use this for the Windows release path.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_id: ${{ steps.draft.outputs.release_id }}
      already_published: ${{ steps.published.outputs.already_published }}
      resolved_tag: ${{ steps.resolve.outputs.resolved_tag }}
      resolved_version: ${{ steps.resolve.outputs.resolved_version }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      unsigned_preview: ${{ steps.matrix.outputs.unsigned_preview }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve tag and version
        id: resolve
        env:
          INPUT_OPERATION: ${{ inputs.operation || 'prepare' }}
          INPUT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          case "$INPUT_OPERATION" in
            prepare|verify|publish) ;;
            *) echo "Unknown release operation." >&2; exit 1 ;;
          esac
          resolved_tag="$INPUT_RELEASE_TAG"
          if [ -z "$resolved_tag" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            resolved_tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$resolved_tag" ]; then
            echo "An explicit release_tag is required for manual runs." >&2
            exit 1
          fi
          if [[ ! "$resolved_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a v-prefixed semantic version." >&2
            exit 1
          fi
          {
            echo "operation=$INPUT_OPERATION"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "resolved_tag=$resolved_tag"
            echo "resolved_version=${resolved_tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Protect published release assets
        id: published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_TAG: ${{ steps.resolve.outputs.resolved_tag }}
        run: node scripts/guard-published-release.mjs

      - name: Resolve build matrix
        if: steps.resolve.outputs.operation == 'prepare' && steps.published.outputs.already_published != 'true'
        id: matrix
        env:
          INPUT_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
          UNSIGNED_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_preview || false }}
        run: |
          python - <<'PY'
          import json
          import os

          platform_sets = {
              "all": {"macos", "windows", "linux"},
              "linux-windows": {"linux", "windows"},
              "linux": {"linux"},
              "windows": {"windows"},
              "macos": {"macos"},
          }
          selected = os.environ.get("INPUT_PLATFORMS") or "all"
          if selected not in platform_sets:
              raise SystemExit(f"Unsupported platforms input: {selected}")

          targets = [
              {
                  "label": "macOS Apple Silicon",
                  "platform": "macos",
                  "os": "macos-latest",
                  "rust_targets": "aarch64-apple-darwin",
                  "args": "--target aarch64-apple-darwin",
              },
              {
                  "label": "macOS Intel",
                  "platform": "macos",
                  "os": "macos-latest",
                  "rust_targets": "x86_64-apple-darwin",
                  "args": "--target x86_64-apple-darwin",
              },
              {
                  "label": "Windows",
                  "platform": "windows",
                  "os": "windows-latest",
                  "rust_targets": "",
                  "args": "",
              },
              {
                  "label": "Linux",
                  "platform": "linux",
                  "os": "ubuntu-22.04",
                  "rust_targets": "",
                  "args": "",
              },
          ]
          include = [target for target in targets if target["platform"] in platform_sets[selected]]
          unsigned_preview = (os.environ.get("UNSIGNED_PREVIEW") or "false").lower() == "true"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              matrix = json.dumps({"include": include}, separators=(",", ":"))
              print(f"build_matrix={matrix}", file=output)
              print(f"unsigned_preview={'true' if unsigned_preview else 'false'}", file=output)
          PY

      - name: Verify version alignment
        if: steps.resolve.outputs.operation == 'prepare' && steps.published.outputs.already_published != 'true'
        env:
          RESOLVED_VERSION: ${{ steps.resolve.outputs.resolved_version }}
        run: |
          package_version="$(python -c "import json, pathlib; print(json.loads(pathlib.Path('package.json').read_text())['version'])")"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/p' src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)"
          tauri_version="$(python -c "import json, pathlib; print(json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version'])")"
          printf 'package.json=%s\nCargo.toml=%s\ntauri.conf.json=%s\nresolved=%s\n' \
            "$package_version" \
            "$cargo_version" \
            "$tauri_version" \
            "$RESOLVED_VERSION"
          test "$package_version" = "$cargo_version"
          test "$package_version" = "$tauri_version"
          test "$package_version" = "$RESOLVED_VERSION"

      - name: Verify updater signing secret
        if: steps.resolve.outputs.operation == 'prepare' && steps.published.outputs.already_published != 'true' && steps.matrix.outputs.unsigned_preview != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required because src-tauri/tauri.conf.json has bundle.createUpdaterArtifacts=true." >&2
            echo "Add the minisign private key as a repository Actions secret before dispatching the release workflow." >&2
            exit 1
          fi

      - name: Reserve private draft for this source
        if: steps.resolve.outputs.operation == 'prepare' && steps.published.outputs.already_published != 'true'
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_TAG: ${{ steps.resolve.outputs.resolved_tag }}
          SOURCE_COMMIT: ${{ steps.resolve.outputs.source_sha }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || github.event_name != 'workflow_dispatch' && contains(github.ref_name, '-') }}
        run: node scripts/prepare-release-draft.mjs

  build-release:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    if: needs.prepare-release.outputs.operation == 'prepare' && needs.prepare-release.outputs.already_published != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-release.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            pkg-config \
            libdbus-1-dev \
            libfuse2 \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Rust toolchain with target
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write unsigned preview Tauri override
        if: ${{ needs.prepare-release.outputs.unsigned_preview == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib

          pathlib.Path("src-tauri/ci.unsigned.conf.json").write_text(
              json.dumps({"bundle": {"createUpdaterArtifacts": False}}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      # This read is not an atomic lock. The workflow tag lock serializes normal
      # operations; repository immutable releases protect late writes after publish.
      - name: Recheck draft before build and upload
        id: upload_guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_TAG: ${{ needs.prepare-release.outputs.resolved_tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_sha }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: node scripts/guard-published-release.mjs

      - name: Build and upload release assets
        if: steps.upload_guard.outputs.already_published != 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.resolved_tag }}
          releaseDraft: true
          assetNamePattern: '[name]_[version]_[platform]_[arch][setup][ext]'
          args: >-
            ${{ matrix.args }}
            ${{ needs.prepare-release.outputs.unsigned_preview == 'true' && '--no-sign --config src-tauri/ci.unsigned.conf.json' || '' }}

  release-manifest:
    name: Publish checksum manifest
    if: needs.prepare-release.outputs.operation == 'prepare' && needs.prepare-release.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Recheck draft before manifest preparation
        id: manifest_guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_TAG: ${{ needs.prepare-release.outputs.resolved_tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_sha }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: node scripts/guard-published-release.mjs

      - name: Download release assets
        if: steps.manifest_guard.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_TAG: ${{ needs.prepare-release.outputs.resolved_tag }}
        run: |
          mkdir -p dist/release
          gh release download "$RESOLVED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/release
          printf '%s' "$RESOLVED_TAG" > dist/release/.resolved-tag

      - name: Verify updater manifest exists
        if: steps.manifest_guard.outputs.already_published != 'true' && needs.prepare-release.outputs.unsigned_preview != 'true'
        run: test -f dist/release/latest.json

      - name: Generate SHA256SUMS.txt
        if: steps.manifest_guard.outputs.already_published != 'true'
        run: |
          cd dist/release
          find . -type f ! -name 'SHA256SUMS.txt' ! -name '.resolved-tag' ! -name 'RELEASE-MANIFEST.json' -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Generate RELEASE-MANIFEST.json
        if: steps.manifest_guard.outputs.already_published != 'true'
        env:
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path('dist/release')
          excluded = {'SHA256SUMS.txt', '.resolved-tag', 'RELEASE-MANIFEST.json'}
          files = [path for path in sorted(root.iterdir()) if path.is_file() and path.name not in excluded]
          if not files:
              raise SystemExit('No release assets were downloaded.')
          manifest = {
              'releaseTag': (root / '.resolved-tag').read_text().strip(),
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'workflowRun': os.environ['GITHUB_RUN_ID'],
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'files': [
                  {'name': path.name, 'sizeBytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                  for path in files
              ],
          }
          (root / 'RELEASE-MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Recheck draft before manifest upload
        if: steps.manifest_guard.outputs.already_published != 'true'
        id: final_guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_TAG: ${{ needs.prepare-release.outputs.resolved_tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_sha }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: node scripts/guard-published-release.mjs

      - name: Upload checksum manifest to the GitHub release
        if: steps.manifest_guard.outputs.already_published != 'true' && steps.final_guard.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolved_tag="$(cat dist/release/.resolved-tag)"
          gh release upload "$resolved_tag" \
            dist/release/SHA256SUMS.txt \
            dist/release/RELEASE-MANIFEST.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload checksum workflow artifact
        if: steps.manifest_guard.outputs.already_published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-manifests
          path: |
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE-MANIFEST.json

  publish-release:
    name: Verify or publish reviewed release
    needs: prepare-release
    if: needs.prepare-release.outputs.operation != 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check reviewed bytes and promote only on explicit publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_TAG: ${{ needs.prepare-release.outputs.resolved_tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_sha }}
          RELEASE_ID: ${{ inputs.approved_release_id }}
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
          EXECUTE_PUBLICATION: ${{ needs.prepare-release.outputs.operation == 'publish' }}
          IMMUTABLE_RELEASES_CONFIRMED: ${{ inputs.immutable_releases_confirmed }}
        run: node scripts/publish-reviewed-release.mjs
