# On 64-bit ARM (Apple Silicon), the RustCrypto `aes` and `polyval` crates use the CPU's AES and
# carry-less multiply instructions only when these cfgs are set; otherwise they fall back to
# software. That fallback made Turso's encrypted spill files about 7 times slower in the part-b
# probes (docs/architecture/research/2026-10-turso-probes-part-b.md) and slows every AES-GCM
# block of the encrypted search index the same way. x86_64 detects AES-NI and CLMUL at runtime.
#
# A RUSTFLAGS environment variable replaces this table entirely (cargo-llvm-cov sets one), so
# builds run that way use the software fallback. Results stay correct; only speed changes.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]

# Every process cargo starts (the Rust tests, `cargo run` and `tauri dev`) keeps the archive key
# in a keychain item of its own. The tests' default service is the installed app's
# `com.yi-ting.pathkeep`, so a test that saves or clears the key without its file-backed keychain
# (`CHB_TEST_KEYRING_DIR`) would change the real one. A bundled app started on its own does not
# get this variable; a value already set in the shell still wins.
[env]
PATHKEEP_PLATFORM_TEST_KEYRING_SERVICE = "com.yi-ting.pathkeep.dev"
