# How PathKeep's builds, checks and tests run on Modal (the modal-offload skill).
# The image mirrors .github/workflows/ci.yml. The Rust version comes from
# rust-toolchain.toml at run time (rustup installs it into the saved state), so
# it is not repeated here.

name = "pathkeep"

[image]
from = "ubuntu:24.04"
python = "3.12"
apt = [
  # ci.yml
  "build-essential", "curl", "file", "pkg-config", "libdbus-1-dev",
  "libglib2.0-dev", "libgtk-3-dev", "libayatana-appindicator3-dev",
  "libssl-dev", "libwebkit2gtk-4.1-dev", "libxdo-dev", "librsvg2-dev",
  "patchelf", "dbus-x11", "gnome-keyring", "systemd", "wget", "xvfb",
  # also needed outside GitHub's runner image
  "ca-certificates", "git", "unzip", "xz-utils", "protobuf-compiler", "perl", "lsof",
  # thread dumps of hung tests
  "gdb",
]
run = [
  "curl -sSf https://sh.rustup.rs | CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh -s -- -y --profile minimal --default-toolchain none --no-modify-path",
  "curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs",
  "curl -fsSL https://bun.sh/install | BUN_INSTALL=/opt/bun bash",
  "curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | CARGO_HOME=/opt/cargo bash",
  "CARGO_HOME=/opt/cargo /opt/cargo/bin/cargo-binstall -y --locked --install-path /opt/cargo/bin cargo-audit cargo-deny",
  "npx -y playwright@latest install-deps chromium",
]
env = { PATH = "/opt/cargo/bin:/opt/bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }

[sandbox]
# A microVM instead of gVisor: SQLite-heavy tests and the E2E backup make many
# small system calls, which are far slower under gVisor.
runtime = "vm"
cpu = 8
memory_gib = 32
timeout_min = 360

[run]
# Not root: root ignores file permissions, and several tests check that a
# read-only directory makes a write fail. ubuntu:24.04 ships this user.
user = "ubuntu"
# Tool caches live under the saved state, so they survive between runs.
# ci.yml runs the checks under dbus-run-session and xvfb-run: owner_process starts the
# real app, which needs a display, and its single-instance handoff needs a session bus.
# Setup starts the same two here, so every command has them.
env = { DISPLAY = ":99", DBUS_SESSION_BUS_ADDRESS = "unix:path=/tmp/offload-dbus", CARGO_HOME = "/state/home/cargo", RUSTUP_HOME = "/state/home/rustup", BUN_INSTALL_CACHE_DIR = "/state/home/bun-cache", PLAYWRIGHT_BROWSERS_PATH = "/state/home/ms-playwright" }
# The desktop crate's build script needs the worker sidecar in src-tauri/binaries.
setup = "(pgrep -x Xvfb >/dev/null || (setsid Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &)) && (test -S /tmp/offload-dbus || dbus-daemon --session --fork --address=unix:path=/tmp/offload-dbus >/dev/null) && bun install --frozen-lockfile >/dev/null && bunx playwright install chromium >/dev/null && bun run prepare:worker-sidecar --profile debug"
artifacts = ["artifacts/e2e"]
